<!--
     The Recouvrement FAQ arch. A NINTH composed arch scene, beside
     paris-scene, la-defense-scene, paris-rooftops-scene, gare-scene,
     rue-scene, haussmann-scene, place-scene and quai-scene.

     Exported with download_assets and stripped of the canvas, page-frame and
     section rects it bakes in, plus the arch clip and drop shadow. The
     viewBox is re-based rather than the paths translated.

     Every tokened fill is mapped; one slate tone (#94A3C4) has no token and
     stays raw hex, the call paris-scene.svg already makes.
-->
