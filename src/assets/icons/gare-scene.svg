<!--
     The Droit fiscal FAQ arch: a railway-station facade under a glazed train
     shed, with taxis and a traveller on the forecourt. A FOURTH composed arch
     scene, beside paris-scene, la-defense-scene and paris-rooftops-scene —
     same 312.5x400 box, a different drawing.

     Exported with download_assets, which bakes every ancestor frame
     background into the file as a painted rect; the canvas, page-frame and
     section rects were stripped, as was the arch clip and drop shadow, since
     the component makes the arch with rounded-t-full on its own container.
     The viewBox is re-based rather than the paths translated.

     Every tokened fill is mapped. One slate-blue tone (#94A3C4) has no token and
     stay raw hex, the same call paris-scene.svg makes for its shading fills.
-->
