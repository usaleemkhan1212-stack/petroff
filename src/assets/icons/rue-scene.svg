<!--
     The Droit social FAQ arch: a Paris street — a shopfront under an awning
     between two Haussmann facades, with a parked car, a cyclist, a streetlamp
     and a tree. A FIFTH composed arch scene, beside paris-scene,
     la-defense-scene, paris-rooftops-scene and gare-scene.

     Exported with download_assets, which bakes every ancestor frame
     background in as a painted rect; the canvas, page-frame and section rects
     were stripped, as were the arch clip and drop shadow, since the component
     makes the arch with rounded-t-full on its own container.

     Every tokened fill is mapped. Two slate tones (#94A3C4, #B8C4DC) have no
     token and stay raw hex, the call paris-scene.svg already makes.
-->
