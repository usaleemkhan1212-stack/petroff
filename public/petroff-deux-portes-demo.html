<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deux portes — démo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --lilas:#F6F5F1; --lilas-2:#E8ECF5; --encre:#122A4C; --encre-60:rgba(18,42,76,.62);
  --periwinkle:#2E5BB8; --periwinkle-p:#C7D6EF; --corail:#D9A441; --brique:#A67C1B; --slate:#94A3C4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;color:var(--encre);background:var(--lilas);line-height:1.6;padding:56px 0}
h2,h3,h4,.btn{font-family:'Poppins',sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.overline{font-family:'Poppins',sans-serif;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--brique);font-weight:600;display:block;margin-bottom:10px}
.mut{color:var(--encre-60)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:16px;text-decoration:none;border-radius:999px;padding:14px 26px;cursor:pointer;border:0;font-family:'Poppins',sans-serif}
.btn-coral{background:var(--corail);color:#fff}
.howwrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
@media(max-width:900px){.howwrap{grid-template-columns:1fr}}
.sec-head h2{font-size:clamp(26px,3vw,36px);font-weight:700;line-height:1.15;margin:0 0 8px}
.sec-head p{font-size:17px;color:var(--encre-60)}
.method{display:flex;flex-direction:column;gap:14px;margin-top:28px}
.step{background:#fff;border:1px solid rgba(18,42,76,.08);border-radius:18px;padding:24px 26px;display:flex;gap:16px;align-items:flex-start}
.step .n{width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--periwinkle-p);color:var(--encre);font:700 20px 'Poppins',sans-serif;display:flex;align-items:center;justify-content:center}
.step h3{font:600 19px 'Poppins',sans-serif;margin-bottom:4px}
.step p{font-size:17px;line-height:1.5;color:var(--encre-60)}
#how-steps .step{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.portes{background:#fff;border:1px solid rgba(18,42,76,.08);border-radius:20px;padding:28px 30px;position:sticky;top:40px}
.portes h3{font:600 20px 'Poppins',sans-serif;margin:12px 0 4px}
.doors{display:flex;gap:8px;background:var(--lilas);border-radius:14px;padding:6px;margin:16px 0 20px}
.door{flex:1;display:flex;flex-direction:column;gap:8px;border:0;background:transparent;border-radius:10px;padding:14px;cursor:pointer;text-align:left;transition:background .15s,box-shadow .15s}
.door svg{width:26px;height:26px;color:var(--encre-60)}
.door .dl{font:600 16px 'Poppins',sans-serif;color:var(--encre-60)}
.door .ds{font:400 16px 'Inter',sans-serif;color:var(--encre-60)}
.door.on{background:#fff;box-shadow:0 8px 22px rgba(18,42,76,.10)}
.door.on svg{color:var(--corail)}
.door.on .dl{color:var(--encre)}
.entry{border-top:1px solid rgba(18,42,76,.10);padding-top:18px}
.entry h4{font:600 20px 'Poppins',sans-serif;color:var(--encre);margin-bottom:12px}
.entry .rows .r{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px dashed rgba(18,42,76,.12);font-size:16px;color:var(--encre-60)}
.entry .rows .r:last-child{border:0}
.entry .rows .r b{font:600 16px 'Poppins',sans-serif;color:var(--encre);text-align:right}
.entry .btn{margin-top:16px;width:100%}
</style>
</head>
<body>
<section id="how"><div class="wrap howwrap">
  <div>
    <div class="sec-head">
      <span class="overline">Comment ça marche</span>
      <h2>Un processus clair pour votre dossier e-commerce</h2>
      <p>Choisissez votre point d'entrée — le processus s'adapte à votre situation.</p>
    </div>
    <div class="method" id="how-steps"></div>
  </div>
  <div class="portes">
    <span class="overline">Deux portes</span>
    <h3>Boutique en création, ou déjà en ligne&nbsp;?</h3>
    <div class="doors" role="tablist" aria-label="Point d'entrée">
      <button class="door on" type="button" data-door="1" onclick="pickDoor(1,this)" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-4h13L20 9M4 9h16v2.2a2 2 0 0 1-4 0 2 2 0 0 1-4 0 2 2 0 0 1-4 0 2 2 0 0 1-4 0zM5.5 12v8h13v-8"/></svg>
        <span class="dl">Je lance ma boutique</span><span class="ds">Site en création</span>
      </button>
      <button class="door" type="button" data-door="2" onclick="pickDoor(2,this)" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5 12 12l8-4.5M12 12v9"/></svg>
        <span class="dl">Je vends déjà</span><span class="ds">Boutique en ligne</span>
      </button>
    </div>
    <div class="entry">
      <span class="overline">Votre point d'entrée</span>
      <h4 id="e-forfait">—</h4>
      <div class="rows">
        <div class="r"><span>Première étape</span><b id="e-first">—</b></div>
        <div class="r"><span>Délai</span><b id="e-delay">—</b></div>
        <div class="r"><span>Forfait</span><b id="e-price">—</b></div>
      </div>
      <a class="btn btn-coral" id="e-cta" href="#">—</a>
    </div>
  </div>
</div></section>
<script>
var DOORS={
 1:{forfait:'Pack CGV e-commerce', first:'Cadrage du parcours', delay:'avant la mise en ligne', price:'1 490 €', cta:'Commander le pack', steps:[
   ['Envoyez vos maquettes',"Le design du site, les specs du parcours, ou quelques lignes sur le projet."],
   ['Cadrage du parcours avant build',"Ce que le Code exige, page par page, spécifié avant que l'interface ne soit construite."],
   ['Devis forfaitaire',"Pack CGV e-commerce : périmètre, livrables et prix, annoncés d'avance."],
   ['Rédaction & mise en ligne',"CGV, mentions, rétractation « un clic » et médiation — rédigées pour la France, prêtes au lancement."],
   ['Suivi dans la durée',"Vos conditions tenues à jour au fil des réformes et du catalogue."]
 ]},
 2:{forfait:'Audit du tunnel de commande', first:'Audit du tunnel', delay:'score /100 sous 5 jours', price:'990 €', cta:"Commander l'audit", steps:[
   ['Envoyez l’URL',"La boutique en ligne, les CGV actuelles, le courrier du régulateur s'il y en a un."],
   ['Audit du tunnel',"Fiche produit, panier, paiement, confirmation passés au Code : score de conformité /100."],
   ['Plan de remise à niveau chiffré',"Les corrections classées par exposition, à budget fermé."],
   ['Corrections par phases',"Mise en conformité étape par étape, sans casser la boutique."],
   ['Suivi dans la durée',"Interface et conditions maintenues à jour, avec un interlocuteur unique."]
 ]}
};
function pickDoor(n,btn){
  document.querySelectorAll('.door').forEach(function(b){var on=(b===btn);b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false');});
  var d=DOORS[n]; if(!d)return;
  var html=''; d.steps.forEach(function(s,i){ html+='<div class="step"><div class="n">'+(i+1)+'</div><div><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div></div>'; });
  document.getElementById('how-steps').innerHTML=html;
  document.getElementById('e-forfait').textContent=d.forfait;
  document.getElementById('e-first').textContent=d.first;
  document.getElementById('e-delay').textContent=d.delay;
  document.getElementById('e-price').textContent=d.price;
  document.getElementById('e-cta').textContent=d.cta;
}
(function(){ var f=document.querySelector('.door'); if(f) pickDoor(1,f); })();
</script>
</body>
</html>
